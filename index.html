<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1410">
  <title>36 Questions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-level="crust">
  <header class="header">
    <h1 class="title">36 Questions</h1>
    <nav class="levels" role="tablist" aria-label="レベル">
      <button class="level-tab" role="tab" data-level="crust">Crust</button>
      <button class="level-tab" role="tab" data-level="mantle">Mantle</button>
      <button class="level-tab" role="tab" data-level="core">Core</button>
    </nav>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <main class="stage">
    <button class="card" id="card" aria-live="polite">
      <div class="card-inner">
        <div class="card-face card-front">
          <span class="card-level" id="frontLevel"></span>
          <span class="card-number" id="frontNumber"></span>
          <span class="card-hint">タップしてめくる</span>
        </div>
        <div class="card-face card-back">
          <span class="card-meta" id="backMeta"></span>
          <p class="card-question" id="question"></p>
        </div>
      </div>
    </button>
  </main>

  <footer class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="前のカード">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="次のカード">›</button>
  </footer>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
