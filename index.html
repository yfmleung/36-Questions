<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1410">
  <title>36 Questions</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body data-level="crust">
  <header class="header">
    <div class="header-top">
      <h1 class="title">36 Questions</h1>
      <select class="lang-select" id="langSelect">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">繁體中文</option>
      </select>
    </div>
    <nav class="levels" role="tablist" id="levels">
      <button class="level-tab" role="tab" data-level="crust">Crust</button>
      <button class="level-tab" role="tab" data-level="mantle">Mantle</button>
      <button class="level-tab" role="tab" data-level="core">Core</button>
    </nav>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <main class="stage">
    <button class="card" id="card" aria-live="polite">
      <div class="card-inner">
        <div class="card-face card-front">
          <span class="card-level" id="frontLevel"></span>
          <span class="card-number" id="frontNumber"></span>
          <span class="card-hint" id="frontHint"></span>
        </div>
        <div class="card-face card-back">
          <span class="card-meta" id="backMeta"></span>
          <p class="card-question" id="question"></p>
          <span class="card-hint" id="backHint"></span>
        </div>
      </div>
    </button>
  </main>

  <footer class="controls">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="dots" id="dots"></div>
    <button class="restart-btn" id="restartBtn" hidden></button>
    <button class="nav-btn" id="nextBtn">›</button>
  </footer>

  <script src="questions.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
